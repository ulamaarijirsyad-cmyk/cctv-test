<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Monitoring CCTV Samsat</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .video-box {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        video {
            width: 100%;
            display: block;
            background: #000;
        }

        .info {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            flex: 1;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        .label {
            color: #666;
            font-size: 14px;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #1677ff;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Monitoring CCTV Samsat</h1>


    <!-- =========================================
         CCTV ASLI
         ========================================= -->

    <div class="video-box">

        <video
            id="cctv"
            controls
            autoplay
            muted
            playsinline>
        </video>

    </div>


    <!-- =========================================
         DATA AI
         ========================================= -->

    <div class="info">

        <div class="card">

            <div class="label">
                Orang Terdeteksi
            </div>

            <div
                class="value"
                id="personCount">
                0
            </div>

        </div>


        <div class="card">

            <div class="label">
                Rata-rata
            </div>

            <div
                class="value"
                id="average">
                0
            </div>

        </div>


        <div class="card">

            <div class="label">
                Status
            </div>

            <div
                class="value"
                id="status">
                SEPI
            </div>

        </div>

    </div>


    <a
        href="/"
        class="back">
        ← Kembali ke Beranda
    </a>

</div>


<!-- =========================================
     HLS.JS
     ========================================= -->

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>


<script>

const video = document.getElementById("cctv");


const CCTV_URL =
"https://livepantau.semarangkota.go.id/0b44f5b2-780d-4f86-9ecd-801041b8925a/video1_stream.m3u8";


if (Hls.isSupported()) {

    const hls = new Hls({

        enableWorker: true,

        lowLatencyMode: true,

        backBufferLength: 30

    });

    hls.loadSource(CCTV_URL);

    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function () {

        video.play();

    });

}
else if (video.canPlayType("application/vnd.apple.mpegurl")) {

    video.src = CCTV_URL;

    video.addEventListener("loadedmetadata", function () {

        video.play();

    });

}


// =================================================
// UPDATE DATA AI
// =================================================

async function updateStatus() {

    try {

        const response =
            await fetch("/api/status");

        const data =
            await response.json();


        document.getElementById("personCount")
            .textContent = data.person_count;


        document.getElementById("average")
            .textContent = data.average;


        document.getElementById("status")
            .textContent = data.status;


    }
    catch (error) {

        console.log(
            "Gagal mengambil status AI",
            error
        );

    }

}


// Update setiap 2 detik

setInterval(updateStatus, 2000);

updateStatus();

</script>


</body>

</html>
